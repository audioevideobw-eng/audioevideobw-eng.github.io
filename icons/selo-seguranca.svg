<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-label="Selo de segurança Brightway: protegido">
  <!-- Selo de segurança da Brightway (desenho próprio, 23/11/2026): escudo esmeralda, borda dourada, check e faixa PROTEGIDO -->
  <defs>
    <linearGradient id="sgOuro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE7A1"/><stop offset=".35" stop-color="#E2B95A"/><stop offset=".6" stop-color="#B8892F"/><stop offset="1" stop-color="#F3D27C"/>
    </linearGradient>
    <linearGradient id="sgVerde" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2FD08A"/><stop offset=".55" stop-color="#0E8F5F"/><stop offset="1" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="sgBrilho" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sgFaixa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2433"/><stop offset="1" stop-color="#0B1018"/>
    </linearGradient>
    <filter id="sgSombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>
  <g filter="url(#sgSombra)">
    <!-- escudo: borda dourada -->
    <path d="M120 12 C150 30 182 38 214 40 C214 120 200 190 120 248 C40 190 26 120 26 40 C58 38 90 30 120 12 Z" fill="url(#sgOuro)"/>
    <!-- miolo esmeralda -->
    <path d="M120 26 C147 42 176 50 202 52 C200 122 186 180 120 232 C54 180 40 122 38 52 C64 50 93 42 120 26 Z" fill="url(#sgVerde)"/>
    <!-- filete interno dourado -->
    <path d="M120 38 C144 52 168 59 190 61 C188 124 175 172 120 216 C65 172 52 124 50 61 C72 59 96 52 120 38 Z" fill="none" stroke="#F3D27C" stroke-opacity=".55" stroke-width="2"/>
    <!-- brilho de cima -->
    <path d="M120 26 C147 42 176 50 202 52 C201 80 197 104 190 124 C160 104 92 96 46 118 C41 99 39 77 38 52 C64 50 93 42 120 26 Z" fill="url(#sgBrilho)"/>
    <!-- check -->
    <path d="M80 128 L109 157 L163 101" fill="none" stroke="#fff" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M80 128 L109 157 L163 101" fill="none" stroke="#E9FFF4" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity=".5"/>
  </g>
  <!-- faixa -->
  <g filter="url(#sgSombra)">
    <path d="M18 214 L44 214 L44 250 L30 242 L18 250 Z" fill="#8A6A22"/>
    <path d="M222 214 L196 214 L196 250 L210 242 L222 250 Z" fill="#8A6A22"/>
    <rect x="34" y="202" width="172" height="40" rx="7" fill="url(#sgFaixa)" stroke="url(#sgOuro)" stroke-width="2.5"/>
    <text x="120" y="228.5" text-anchor="middle" font-family="Inter, Montserrat, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="4" fill="#F3D27C">PROTEGIDO</text>
  </g>
</svg>
