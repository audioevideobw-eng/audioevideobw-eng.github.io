name: App Android (BW)
# Monta o .apk do BW para Android (Capacitor, docs/app-android) e publica em downloads/BW-Android.apk.
# Criado por Claude em 24/11/2026. Roda quando o projeto Android muda ou pelo botão "Run workflow".
on:
  push:
    branches: [main]
    paths: ["docs/app-android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Chave de assinatura (se o dono cadastrou)
        env: { KS: "${{ secrets.BW_KEYSTORE_B64 }}" }
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/bw.jks"; echo "BW_KEYSTORE=$RUNNER_TEMP/bw.jks" >> $GITHUB_ENV; echo "assinada com a chave do BW"; else echo "sem chave própria: chave de teste"; fi
      - name: Montar o projeto
        working-directory: docs/app-android
        run: npm ci --no-audit --no-fund && npx cap sync android
      - name: Gerar o .apk
        working-directory: docs/app-android/android
        env: { BW_KEYSTORE_SENHA: "${{ secrets.BW_KEYSTORE_SENHA }}" }
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Publicar em downloads/
        run: |
          cp docs/app-android/android/app/build/outputs/apk/debug/app-debug.apk downloads/BW-Android.apk
          ls -l downloads/BW-Android.apk
          printf '{"versao":"1.0.%s","data":"%s","tamanho":%s}\n' "$GITHUB_RUN_NUMBER" "$(date -u +%Y-%m-%dT%H:%MZ)" "$(stat -c%s downloads/BW-Android.apk)" > downloads/android-versao.json
          git config user.name "Brightway (automação)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/BW-Android.apk downloads/android-versao.json
          git commit -m "App Android 1.0.$GITHUB_RUN_NUMBER (automação)" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
