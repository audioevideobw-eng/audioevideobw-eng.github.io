name: Notícias (a cada 2 h)
# Atualiza noticias.json para a página NOTÍCIAS. Criado por Claude em 15/11/2026.
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: noticias
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Buscar manchetes
        run: python3 docs/automacoes/noticias.py noticias.json
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- noticias.json; then echo "sem mudança"; exit 0; fi
          git config user.name "Brightway (automação)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add noticias.json
          git commit -m "Notícias atualizadas (automação)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
