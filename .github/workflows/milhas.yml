name: Milhas (a cada hora)
# Publica milhas.json com as cotações que o ADM lança em Configuração → COTAÇÕES DE MILHAS. Criado por Claude em 16/11/2026.
on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: milhas
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ler cotações do ADM
        run: python3 docs/automacoes/milhas.py milhas.json
      - name: Publicar se mudou
        run: |
          if git diff --quiet -- milhas.json; then echo "sem mudança"; exit 0; fi
          git config user.name "Brightway (automação)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add milhas.json
          git commit -m "Milhas atualizadas pelo ADM (automação)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0; sleep 10; done
          exit 1
