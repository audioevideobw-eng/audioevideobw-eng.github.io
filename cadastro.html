<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro — BW Audiovisual</title>
<style>
:root{--navy:#0b1220;--navy2:#111a2c;--line:#1e2c42;--txt:#e8eef7;--mut:#8fa2bd;--gold:#d4a94a;--gold2:#e5c069;--up:#3f9d6b;--dn:#c0564a}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(180deg,#0b1220,#0d1526 60%,#0b1220);color:var(--txt);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 16px}
.logo{margin:24px 0 6px;font-size:26px;letter-spacing:.22em;color:var(--gold);font-weight:700}
.logo small{display:block;font-size:10px;letter-spacing:.4em;color:var(--mut);text-align:center;margin-top:4px}
.card{background:var(--navy2);border:1px solid var(--line);border-radius:16px;padding:20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
h1{font-size:18px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;line-height:1.5;margin-bottom:16px}
label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:12px 0 4px}
input{width:100%;background:#0b1220;border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:11px 12px;font-size:15px;outline:none}
input:focus{border-color:var(--gold)}
button{width:100%;background:var(--gold);color:#0b1220;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.04em;margin-top:18px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.msg{font-size:13px;margin-top:12px;line-height:1.5}
.ok{color:var(--up)} .err{color:var(--dn)}
.rodape{color:var(--mut);font-size:11px;margin-top:18px;text-align:center;line-height:1.6}
.invalido{max-width:460px;text-align:center}
.invalido h1{color:var(--dn)}
</style>
</head>
<body>
  <div class="logo">BW AUDIOVISUAL<small>EVENTOS · TRANSMISSÕES · PRODUÇÃO</small></div>
  <div class="card" id="box">
    <h1>Cadastro de colaborador</h1>
    <div class="sub">Preencha seus dados para entrar na escala da equipe. O administrador recebe na hora.</div>
    <label>Nome completo</label>
    <input id="fNome" type="text" placeholder="Seu nome completo" autocomplete="name">
    <label>Função</label>
    <input id="fFuncao" type="text" placeholder="Ex.: câmera, som, apoio" autocomplete="organization-title">
    <label>Telefone / WhatsApp</label>
    <input id="fTel" type="tel" placeholder="(11) 99999-9999" autocomplete="tel">
    <label>E-mail</label>
    <input id="fEmail" type="email" placeholder="seu@email.com" autocomplete="email">
    <label>CPF</label>
    <input id="fCPF" type="text" placeholder="000.000.000-00" autocomplete="off">
    <button id="fEnviar">Enviar cadastro</button>
    <div class="msg" id="fMsg"></div>
  </div>
  <div class="rodape">BW Audiovisual · seus dados são usados apenas para a organização das equipes de eventos.</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/bw-sync.js"></script>
<script>
(function(){
  "use strict";
  var params = new URLSearchParams(location.search);
  var TOKEN = (params.get("t") || params.get("cadastro") || "").trim();
  var EV_ID = params.get("ev") || "";
  var EV_NOME = params.get("nome") || "";
  var GALERIA = params.get("galeria") || "";
  var CLI_TOKEN = params.get("cliente") || "";
  var SB_URL = "https://zdtnetplvdonogmdvarx.supabase.co";
  var SB_ANON = "sb_publishable_qJ2mIx1hcn_ZH75-yxJiDA_OI-EHyIU";
  function $(s){ return document.querySelector(s); }
  function maskCPF(v){ v=(v||"").replace(/\D/g,"").slice(0,11); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d)/,"$1.$2"); v=v.replace(/(\d{3})(\d{1,2})$/,"$1-$2"); return v; }
  function maskTel(v){ v=(v||"").replace(/\D/g,"").slice(0,11); if(v.length<=10) return v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3").replace(/[-\s]+$/,""); return v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3").replace(/[-\s]+$/,""); }
  if (GALERIA) {
    /* modo GALERIA: o cliente vê as fotos do evento (leitura pública do Storage) */
    document.body.innerHTML = '<div class="logo">BW AUDIOVISUAL<small>EVENTOS · TRANSMISSÕES · PRODUÇÃO</small></div>' +
      '<div class="card"><h1>Fotos do evento</h1><div class="sub" id="gNome">Carregando…</div>' +
      '<div id="gFotos" style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px"></div>' +
      '<div class="msg" id="gMsg"></div></div>' +
      '<div class="rodape">BW Audiovisual · fotos do seu evento</div>';
    (async function(){
      try {
        var sb = window.supabase.createClient(SB_URL, SB_ANON);
        var pasta = GALERIA;
        var res = await sb.storage.from("eventos-midia").list(pasta, { limit: 100 });
        var fotos = (res.data || []).filter(function(a){ return a.name && a.name.indexOf(".") > 0; });
        document.querySelector("#gNome").textContent = fotos.length + " foto(s) do evento";
        document.querySelector("#gFotos").innerHTML = fotos.map(function(a){
          var u = SB_URL + "/storage/v1/object/public/eventos-midia/" + pasta + "/" + a.name;
          return '<a href="' + u + '" target="_blank"><img src="' + u + '" style="width:100%;height:110px;object-fit:cover;border-radius:8px"></a>';
        }).join("");
        if (!fotos.length) document.querySelector("#gMsg").textContent = "Nenhuma foto publicada ainda.";
      } catch (e) {
        document.querySelector("#gMsg").textContent = "Não consegui carregar a galeria.";
      }
    })();
    return;
  }
  if (CLI_TOKEN) {
    /* modo CADASTRO DE CLIENTE: empresa preenche os dados dela */
    document.body.innerHTML = '<div class="logo">BW AUDIOVISUAL<small>EVENTOS · TRANSMISSÕES · PRODUÇÃO</small></div>' +
      '<div class="card" id="box"><h1>Cadastro de cliente</h1>' +
      '<div class="sub">Preencha os dados da empresa — o administrador recebe na hora.</div>' +
      '<label>Nome / Empresa</label><input id="cNome" type="text" placeholder="Nome da empresa">' +
      '<label>CNPJ</label><input id="cCNPJ" type="text" placeholder="00.000.000/0000-00">' +
      '<label>Telefone</label><input id="cTel" type="tel" placeholder="(11) 99999-9999">' +
      '<label>E-mail</label><input id="cEmail" type="email" placeholder="contato@empresa.com">' +
      '<label>Endereço</label><input id="cEnd" type="text" placeholder="Rua, número, bairro">' +
      '<label>Cidade / UF</label><input id="cCidade" type="text" placeholder="Cidade — UF">' +
      '<button id="cEnviar">Enviar cadastro</button><div class="msg" id="cMsg"></div></div>' +
      '<div class="rodape">BW Audiovisual</div>';
    var mCNPJ = function(v){ v=(v||"").replace(/\D/g,"").slice(0,14); return v.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,"$1.$2.$3/$4-$5"); };
    var mTel = function(v){ v=(v||"").replace(/\D/g,"").slice(0,11); if(v.length<=10) return v.replace(/(\d{2})(\d{4})(\d{0,4})/,"($1) $2-$3").replace(/[-\s]+$/,""); return v.replace(/(\d{2})(\d{5})(\d{0,4})/,"($1) $2-$3").replace(/[-\s]+$/,""); };
    document.querySelector("#cTel").addEventListener("input", function(e){ e.target.value = mTel(e.target.value); });
    document.querySelector("#cCNPJ").addEventListener("input", function(e){ e.target.value = mCNPJ(e.target.value); });
    document.querySelector("#cEnviar").addEventListener("click", async function(){
      var btn = document.querySelector("#cEnviar"), msg = document.querySelector("#cMsg");
      var c = { nome: document.querySelector("#cNome").value.trim(), cnpj: document.querySelector("#cCNPJ").value.trim(),
        tel: document.querySelector("#cTel").value.trim(), email: document.querySelector("#cEmail").value.trim(),
        end: document.querySelector("#cEnd").value.trim(), cidade: document.querySelector("#cCidade").value.trim() };
      if (!c.nome) { msg.textContent = "Informe o nome da empresa."; msg.className = "msg err"; return; }
      btn.disabled = true; btn.textContent = "Enviando…";
      try {
        var sb = window.supabase.createClient(SB_URL, SB_ANON);
        var res = await sb.from("equipe_cadastros").insert({ token: CLI_TOKEN, nome: c.nome, funcao: "cliente",
          telefone: c.tel, email: c.email, cpf: c.cnpj, observacao: JSON.stringify(c) });
        if (res.error) throw res.error;
        document.querySelector("#box").innerHTML = '<h1 style="color:#3f9d6b">✓ Cadastro enviado!</h1><div class="sub">Obrigado! O administrador da BW vai confirmar seus dados.</div>';
      } catch (e) {
        msg.textContent = "Não consegui enviar (" + (e.message || e) + "). Tente de novo.";
        msg.className = "msg err"; btn.disabled = false; btn.textContent = "Enviar cadastro";
      }
    });
    return;
  }
  if (EV_ID) {
    /* modo PRESENÇA: mínimo — evento, nome e confirmação */
    document.body.innerHTML = '<div class="logo">BW AUDIOVISUAL<small>EVENTOS · TRANSMISSÕES · PRODUÇÃO</small></div>' +
      '<div class="card"><h1>Confirmação de presença</h1>' +
      '<div class="sub">Evento: <b>' + EV_NOME.replace(/[<>]/g, "") + '</b></div>' +
      '<label>Seu nome</label><input id="pNome" type="text" placeholder="Seu nome">' +
      '<label>Seu e-mail</label><input id="pEmail" type="email" placeholder="seu@email.com">' +
      '<div id="pBotoes" style="display:flex;gap:8px;margin-top:16px">' +
      '<button id="pSim" style="background:#3f9d6b;color:#fff;margin:0">✓ Vou</button>' +
      '<button id="pNao" style="background:#c0564a;color:#fff;margin:0">✕ Não vou</button>' +
      '</div><div class="msg" id="pMsg"></div></div>' +
      '<div class="rodape">BW Audiovisual</div>';
    var resposta = "sim";
    var botaoSim = document.querySelector("#pSim"), botaoNao = document.querySelector("#pNao");
    botaoSim.style.outline = "2px solid #e5c069";
    botaoSim.onclick = function(){ resposta = "sim"; botaoSim.style.outline = "2px solid #e5c069"; botaoNao.style.outline = "none"; };
    botaoNao.onclick = function(){ resposta = "nao"; botaoNao.style.outline = "2px solid #e5c069"; botaoSim.style.outline = "none"; };
    document.querySelector("#pMsg").className = "msg";
    function enviar() {
      var nome = document.querySelector("#pNome").value.trim();
      var email = document.querySelector("#pEmail").value.trim();
      var msg = document.querySelector("#pMsg");
      if (!nome) { msg.textContent = "Escreva seu nome."; msg.className = "msg err"; return; }
      if (!email || email.indexOf("@") < 1) { msg.textContent = "Escreva seu e-mail (para identificar você na equipe)."; msg.className = "msg err"; return; }
      botaoSim.disabled = botaoNao.disabled = true;
      msg.textContent = "Enviando…"; msg.className = "msg";
      var sb = window.supabase.createClient(SB_URL, SB_ANON);
      sb.from("equipe_presenca").insert({ evento_id: EV_ID, colaborador: nome, email: email, resposta: resposta })
        .then(function(res){
          if (res.error) throw res.error;
          document.body.innerHTML = '<div class="logo">BW AUDIOVISUAL<small>EVENTOS · TRANSMISSÕES · PRODUÇÃO</small></div>' +
            '<div class="card"><h1 style="color:#3f9d6b">✓ Resposta enviada!</h1>' +
            '<div class="sub">Obrigado, ' + nome.split(" ")[0] + '! ' +
            (resposta === "sim" ? "Presença confirmada" : "Tudo bem, ficamos sem você desta vez") +
            ' no evento ' + EV_NOME.replace(/[<>]/g, "") + '.</div></div>' +
            '<div class="rodape">Pode fechar esta página.</div>';
        })
        .catch(function(e){
          msg.textContent = "Não consegui enviar (" + (e.message || e) + "). Tente de novo.";
          msg.className = "msg err";
          botaoSim.disabled = botaoNao.disabled = false;
        });
    }
    botaoSim.addEventListener("click", enviar);
    botaoNao.addEventListener("click", enviar);
    return;
  }
  if (!TOKEN) {
    document.body.innerHTML = '<div class="card invalido"><h1>Link inválido</h1><div class="sub">Este link de cadastro não é válido. Peça um novo link ao administrador da BW Audiovisual.</div></div>';
    return;
  }
  $("#fTel").addEventListener("input", function(e){ e.target.value = maskTel(e.target.value); });
  $("#fCPF").addEventListener("input", function(e){ e.target.value = maskCPF(e.target.value); });
  $("#fEnviar").addEventListener("click", async function(){
    var btn = $("#fEnviar"), msg = $("#fMsg");
    var c = { nome: $("#fNome").value.trim(), funcao: $("#fFuncao").value.trim(),
              telefone: $("#fTel").value.trim(), email: $("#fEmail").value.trim(), cpf: $("#fCPF").value.trim() };
    if (!c.nome) { msg.textContent = "Informe seu nome completo."; msg.className = "msg err"; return; }
    if (c.cpf && c.cpf.replace(/\D/g,"").length !== 11) { msg.textContent = "CPF incompleto (11 números)."; msg.className = "msg err"; return; }
    btn.disabled = true; btn.textContent = "Enviando…"; msg.textContent = ""; msg.className = "msg";
    try {
      var sb = window.supabase.createClient(SB_URL, SB_ANON);
      var res = await sb.from("equipe_cadastros").insert({ token: TOKEN, nome: c.nome, funcao: c.funcao, telefone: c.telefone, email: c.email, cpf: c.cpf });
      if (res.error) throw res.error;
      $("#box").innerHTML = '<h1 style="color:var(--up)">✓ Cadastro enviado!</h1><div class="sub">Obrigado, ' + c.nome.split(" ")[0] + '! O administrador da BW vai confirmar sua entrada na equipe. Você pode fechar esta página.</div>';
    } catch (e) {
      msg.textContent = "Não consegui enviar (" + (e.message || e) + "). Verifique a conexão e tente de novo.";
      msg.className = "msg err";
      btn.disabled = false; btn.textContent = "Enviar cadastro";
    }
  });
})();
</script>
</body>
</html>
