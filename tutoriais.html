<style>
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 120px}
.tu-hero{margin:8px 0 18px;padding:22px;border-radius:22px;background:linear-gradient(135deg,rgba(76,141,255,.16),rgba(232,181,74,.12));border:1px solid var(--bw-card-borda)}
.tu-hero h1{margin:0 0 6px;font:900 clamp(24px,4vw,34px) Inter,sans-serif;letter-spacing:.04em;color:var(--bw-marfim)}
.tu-hero p{margin:0 0 14px;font:500 15px/1.55 Inter,sans-serif;color:var(--bw-texto-2)}
.tu-hero input{width:100%;box-sizing:border-box;min-height:50px;padding:0 16px;border-radius:14px;border:1px solid var(--bw-card-borda);background:rgba(0,0,0,.18);color:var(--bw-marfim);font:600 16px Inter,sans-serif}
.tu-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;scrollbar-width:none}.tu-chips::-webkit-scrollbar{display:none}
.tu-chips button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--bw-card-borda);background:var(--bw-card-bg);color:var(--bw-marfim);font:800 12px Inter,sans-serif;letter-spacing:.05em;cursor:pointer}
.tu-chips button.on{background:var(--gold,#E8B54A);color:#111;border-color:transparent}
.tu-cat{margin:6px 0 22px}.tu-cat h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font:900 14px Inter,sans-serif;letter-spacing:.12em;color:var(--bw-marfim)}
.tu-cat h2 span{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,transparent);font-size:18px}
.tu-cat h2 small{margin-left:auto;font:600 12px Inter,sans-serif;letter-spacing:0;color:var(--bw-texto-3)}
.tu-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tu-card{min-width:0;display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;background:var(--bw-card-bg);border:1px solid var(--bw-card-borda);border-left:4px solid var(--c);text-decoration:none;color:inherit;transition:transform .15s}
.tu-card:hover{transform:translateY(-2px)}.tu-card .ic{font-size:26px}.tu-card b{font:800 15px/1.3 Inter,sans-serif;color:var(--bw-marfim)}
.tu-card small{font:500 13px/1.5 Inter,sans-serif;color:var(--bw-texto-3)}.tu-card .meta{margin-top:auto;padding-top:6px;font:700 11px Inter,sans-serif;letter-spacing:.04em;color:var(--c)}
.tu-card .meta i{font-style:normal;color:#2FD08A}.tu-vazio{font:600 15px Inter,sans-serif;color:var(--bw-texto-3)}
.tu-voltar{min-height:40px;padding:0 14px;margin:6px 0 12px;border-radius:12px;border:1px solid var(--bw-card-borda);background:var(--bw-card-bg);color:var(--bw-marfim);font:800 12px Inter,sans-serif;cursor:pointer}
.tu-cab{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px}.tu-cab .ic{flex:none;display:grid;place-items:center;width:58px;height:58px;border-radius:16px;font-size:30px;background:color-mix(in srgb,var(--c) 22%,transparent)}
.tu-cab small{font:800 11px Inter,sans-serif;letter-spacing:.12em;color:var(--c)}.tu-cab h1{margin:2px 0 4px;font:900 clamp(20px,3.4vw,28px)/1.2 Inter,sans-serif;color:var(--bw-marfim)}
.tu-cab p{margin:0;font:500 14px/1.5 Inter,sans-serif;color:var(--bw-texto-2)}.tu-cab .meta{margin-top:4px;font-weight:700;color:var(--bw-texto-3);font-size:12px}
.tu-precisa,.tu-texto{margin:0 0 14px;padding:14px 16px;border-radius:14px;background:var(--bw-card-bg);border:1px solid var(--bw-card-borda);font:500 14px/1.6 Inter,sans-serif;color:var(--bw-texto-2)}
.tu-precisa b{color:var(--bw-marfim);font-size:12px;letter-spacing:.08em}.tu-texto p{margin:0 0 8px}.tu-texto p:last-child{margin:0}
.tu-player{position:relative;margin-bottom:16px;padding:14px;border-radius:20px;background:#0b0f18;border:1px solid var(--bw-card-borda)}
.tu-selo{position:absolute;top:10px;right:12px;z-index:2;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);font:800 10px Inter,sans-serif;letter-spacing:.1em;color:#cfd6e6}
.tu-video{width:100%;border-radius:12px;margin-bottom:10px;background:#000}
.tu-apar{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:2px 0 4px}
.tu-apar button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dfe6f2;font:800 12px Inter,sans-serif;cursor:pointer}
.tu-apar button.on{background:var(--c);color:#111;border-color:transparent}
.tf{position:relative;width:270px;height:560px;margin:10px auto 0;padding:10px;border-radius:46px;background:linear-gradient(145deg,#2a2d33,#0d0e11);box-shadow:0 0 0 2px #3a3d45,0 20px 44px rgba(0,0,0,.55)}
.tf-android{padding:7px;border-radius:30px;background:linear-gradient(145deg,#23262c,#0b0c0f)}
.tf-tela *{text-transform:none;font-style:normal}
.tf-campo.foco{border-color:#4C8DFF;box-shadow:0 0 0 3px rgba(76,141,255,.25)}
.tf-tela{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#0b0e15;display:flex;flex-direction:column;color:#eef2f8;font-family:Inter,sans-serif}
.tf-android .tf-tela{border-radius:24px}
.tf-status{flex:none;position:relative;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px;font:700 11px Inter,sans-serif}
.tf-ic{font-size:8px;letter-spacing:1px}
.tf-ilha{position:absolute;left:50%;top:6px;width:80px;height:21px;margin-left:-40px;border-radius:12px;background:#000}
.tf-furo{position:absolute;left:50%;top:9px;width:11px;height:11px;margin-left:-6px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #1e2129}
.tf-url{flex:none;margin:2px 10px 6px;padding:7px 10px;border-radius:12px;background:#1b2130;font:600 10px Inter,sans-serif;color:#b9c3d6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-topo{flex:none;display:grid;grid-template-columns:40px minmax(0,1fr) 60px;align-items:center;height:42px;padding:0 6px;border-bottom:1px solid rgba(255,255,255,.08)}
.tf-topo b{font:800 13px Inter,sans-serif;text-align:center;padding:7px 2px;border-radius:10px;white-space:nowrap}
.tf-topo span{font:800 12px Inter,sans-serif;text-align:center;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tf-corpo{flex:1;min-height:0;overflow:hidden;position:relative;padding:10px 12px}
.tf-rolo{position:relative;display:flex;flex-direction:column;gap:8px;transition:transform .95s cubic-bezier(.3,.1,.2,1)}
.tf-li{padding:11px 12px;border-radius:12px;background:#1a2030;font:700 12px/1.3 Inter,sans-serif;color:#e8edf6;transition:background .2s,transform .15s,box-shadow .2s}
.tf-li.pri{background:#E8B54A;color:#111}
.tf-sec{padding:6px 2px 0;font:800 10px Inter,sans-serif;letter-spacing:.12em;color:#8e9ab0}
.tf .toque{background:#4C8DFF!important;color:#fff!important;transform:scale(.96);box-shadow:0 0 0 5px rgba(76,141,255,.35)}
.tf-campo{padding:8px 12px 10px;border-radius:12px;background:#121826;border:2px solid #4C8DFF55}
.tf-campo small{display:block;font:700 9px Inter,sans-serif;letter-spacing:.08em;color:#8e9ab0;margin-bottom:3px}
.tf-campo span{display:flex;align-items:center;min-height:18px;font:600 13px Inter,sans-serif}
.tf-car{font-style:normal;color:#4C8DFF;animation:tuPisca 1s steps(2) infinite}@keyframes tuPisca{50%{opacity:0}}
.tf-abas{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid rgba(255,255,255,.08);padding:5px 2px 2px;background:#0e121b}
.tf-abas span{font:700 7.5px/1.4 Inter,sans-serif;text-align:center;color:#8e9ab0;padding:3px 0;border-radius:8px}
.tf-abas span.on{color:#E8B54A}
.tf-home{flex:none;display:block;width:96px;height:4px;border-radius:3px;background:#f2f4f8;opacity:.85;margin:7px auto 8px}
.tf-nav{flex:none;display:flex;justify-content:space-around;padding:6px 34px 8px;color:#c9d1e0}.tf-nav i{font-style:normal;font-size:12px}
.tf-sis{background:#05070b}.tf-sis .tf-corpo{display:flex;align-items:center}.tf-sis .tf-rolo{width:100%;padding:14px;border-radius:20px;background:#1e2436}
.tf-sistit{font:800 13px Inter,sans-serif;text-align:center;padding-bottom:4px}
.tf-veu{position:absolute;inset:0;z-index:4;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none}
.tf-folha{position:absolute;left:0;right:0;bottom:0;z-index:5;height:64%;display:flex;flex-direction:column;padding:6px 0 16px;border-radius:20px 20px 0 0;background:#151a26;transform:translateY(105%);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.tf-pega{display:block;width:38px;height:4px;border-radius:3px;background:#4b5468;margin:2px auto 7px}
.tf-folha>b{font:800 11px Inter,sans-serif;letter-spacing:.12em;text-align:center;padding-bottom:6px}
.tf-fcorpo{flex:1;min-height:0;overflow:hidden;padding:4px 12px}
.tf-tela.folha .tf-folha{transform:none}.tf-tela.folha .tf-veu{opacity:1}
.tf-teclado{position:absolute;left:0;right:0;bottom:0;z-index:6;padding:7px 3px 22px;background:#1c2130;transform:translateY(105%);transition:transform .35s}
.tf-tela.tecl .tf-teclado{transform:none}
.tf-tl{display:flex;justify-content:center;gap:3px;margin-bottom:5px}.tf-tl i{display:grid;place-items:center;width:21px;height:30px;border-radius:5px;background:#3a4255;font:600 11px Inter,sans-serif;font-style:normal}
.tf-tl i.esp{width:130px;font-size:9px;color:#b9c3d6}
.tf-dedo{position:absolute;left:62%;top:105%;z-index:9;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(255,255,255,.42);border:2px solid rgba(255,255,255,.9);box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:left .65s cubic-bezier(.4,0,.2,1),top .65s cubic-bezier(.4,0,.2,1),opacity .3s,transform .15s}
.tf-dedo.ve{opacity:1}.tf-dedo.aperta{transform:scale(.75);background:rgba(255,255,255,.75)}
.tf-dedo.arrasta{transition:left .95s cubic-bezier(.3,.1,.2,1),top .95s cubic-bezier(.3,.1,.2,1),opacity .3s}
.tf-calmo *{transition:none!important;animation:none!important}
/* 25/11: passos com as TELAS DE VERDADE (fotos de assets/tutoriais) */
.tf-real{background:#000}
.tf-foto{position:relative;flex:none;width:100%;aspect-ratio:390/766;overflow:hidden;background:#06080D}
.tf-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.tf-img.b{opacity:0;transition:opacity .34s}.tf-img.b.ve{opacity:1}
.tf-onda{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid rgba(76,141,255,.95);opacity:0;pointer-events:none;z-index:3}
.tf-onda.vai{animation:tfOnda .6s ease-out}@keyframes tfOnda{0%{opacity:1;transform:scale(.4)}100%{opacity:0;transform:scale(1.7)}}
.tf-digit{position:absolute;z-index:4;display:flex;align-items:center;padding:4px 8px;border-radius:8px;background:#fff;color:#111;border:2px solid #4C8DFF;font:600 11px Inter,sans-serif;box-sizing:border-box;white-space:nowrap;overflow:hidden}
.tf-digit[hidden]{display:none}
.tf-real .tf-home,.tf-real .tf-nav{margin-top:auto}
.tf-ilus{position:absolute;right:10px;top:34px;z-index:8;padding:3px 7px;border-radius:6px;background:rgba(232,181,74,.92);color:#111;font:900 7.5px Inter,sans-serif;letter-spacing:.1em}
.tu-som{border-color:var(--bw-card-borda)}.tu-som.on{background:#22c55e!important;color:#fff!important;border-color:transparent!important}
.tu-som.chama{animation:tuChama 1.6s ease-in-out infinite}@keyframes tuChama{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.55)}50%{box-shadow:0 0 0 8px rgba(34,197,94,0)}}
.tu-prog{height:4px;margin:12px 0 8px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}.tu-prog i{display:block;height:100%;width:0;background:var(--c);transition:width .4s}
.tu-legenda{min-height:44px;margin:0;font:500 14px/1.5 Inter,sans-serif;color:#d7deeb}.tu-legenda b{color:#fff}
.tu-ctl{display:flex;gap:8px;justify-content:center;margin-top:10px}.tu-ctl button{min-width:46px;min-height:42px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#fff;font:800 13px Inter,sans-serif;cursor:pointer}
.tu-ctl .pri{background:var(--c);color:#111;border-color:transparent;min-width:150px}
.tu-passos{list-style:none;margin:0 0 16px;padding:0;display:flex;flex-direction:column;gap:8px}
.tu-passo{width:100%;display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;border:1px solid var(--bw-card-borda);background:var(--bw-card-bg);color:inherit;text-align:left;cursor:pointer}
.tu-passo .n{flex:none;display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:rgba(127,127,127,.18);font:900 13px Inter,sans-serif;color:var(--bw-marfim)}
.tu-passo b{display:block;font:800 14px Inter,sans-serif;color:var(--bw-marfim)}.tu-passo small{display:block;margin-top:2px;font:500 13px/1.5 Inter,sans-serif;color:var(--bw-texto-3)}
.tu-passo.on{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 40%,transparent)}.tu-passo.on .n{background:var(--c);color:#111}.tu-passo.feito .n{background:#2FD08A;color:#111}
.tu-conectar,.tu-duvidas{margin:0 0 16px;padding:16px;border-radius:18px;background:var(--bw-card-bg);border:1px solid var(--c)}
.tu-conectar h2,.tu-duvidas h2{margin:0 0 4px;font:900 13px Inter,sans-serif;letter-spacing:.12em;color:var(--bw-marfim)}.tu-conectar>p{margin:0 0 12px;font:500 14px/1.5 Inter,sans-serif;color:var(--bw-texto-2)}
.tu-duvidas{border-color:var(--bw-card-borda)}.tu-duvidas details{padding:10px 0;border-top:1px solid var(--bw-card-borda)}.tu-duvidas summary{cursor:pointer;font:700 14px Inter,sans-serif;color:var(--bw-marfim)}
.tu-duvidas details p{margin:8px 0 0;font:500 14px/1.55 Inter,sans-serif;color:var(--bw-texto-2)}
.tu-ir{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;margin-bottom:16px;border-radius:14px;background:var(--c);color:#111;font:900 13px Inter,sans-serif;letter-spacing:.06em;text-decoration:none}
.tu-mais{font:500 13px/2 Inter,sans-serif;color:var(--bw-texto-3)}.tu-mais b{color:var(--bw-marfim)}.tu-mais a{margin-left:10px;color:var(--c);text-decoration:none;font-weight:700;white-space:normal}
</style>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"}[c]; }); };
  var vb = $("btnVoltar"); if (vb) vb.onclick = function () { if (history.length > 1) history.back(); else location.href = "./"; };
  (async function () {
    var el = $("userBox"); if (!el) return;
    try {
      var sb = window.BWSync && BWSync.cliente(); var s = sb ? await sb.auth.getSession() : null;
      var u = s && s.data && s.data.session && s.data.session.user;
      el.innerHTML = u ? '<a href="login.html" class="bw-logado" title="Conta: ' + esc(u.email) + '"><i></i>LOGADO</a>'
                       : '<a href="login.html" class="bw-btn bw-btn--vidro" style="min-height:34px;padding:0 14px;font-size:12px">LOGIN</a>';
    } catch (e) { }
  })();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () { });
})();
</script>
